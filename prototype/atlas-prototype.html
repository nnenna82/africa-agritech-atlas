<title>Africa AgriTech Atlas</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with section tabs; a single content column (max 1180px) of filter rows, tables and card grids. */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --sunk:#eceee7; --fg:#18231d; --muted:#5b665e; --line:#d9ddd3;
  --accent:#1f6b4f; --accent-soft:#dcebe3; --gold:#b5821b; --gold-soft:#f3e7cb;
  --good:#2f7d4a; --warn:#a8660f; --bad:#b23b30;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#18201b; --sunk:#0c110e; --fg:#e7ece6; --muted:#9aa69d; --line:#2c3730;
  --accent:#6cc39b; --accent-soft:#1f3a2e; --gold:#e0b55a; --gold-soft:#3a2f17;
  --good:#6cc38a; --warn:#e3a54a; --bad:#ef7d70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#18201b; --sunk:#0c110e; --fg:#e7ece6; --muted:#9aa69d; --line:#2c3730;
  --accent:#6cc39b; --accent-soft:#1f3a2e; --gold:#e0b55a; --gold-soft:#3a2f17;
  --good:#6cc38a; --warn:#e3a54a; --bad:#ef7d70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)} a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{font:700 20px/1 var(--display);letter-spacing:-.01em;display:flex;gap:8px;align-items:baseline;color:var(--fg);text-decoration:none}
.brand small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
nav a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;font-size:14px}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
nav a:hover{color:var(--fg)}
main{padding-block:28px 64px}
h1{font:700 clamp(28px,4vw,40px)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
h2{font:700 22px/1.2 var(--display);margin:0 0 12px;text-wrap:balance}
h3{font:600 16px/1.3 var(--body);margin:0 0 6px}
.lead{font-size:17px;max-width:68ch;color:var(--fg);margin:0 0 6px}
.sub{color:var(--muted);max-width:70ch;margin:0}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section{margin-top:36px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 14px;align-items:center}
input[type=search],select,input[type=text],input[type=url],textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%}
input[type=search]{min-width:220px;flex:1 1 220px}
.count{font:500 12px var(--mono);color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0;white-space:nowrap}
th button{all:unset;cursor:pointer} th button:hover{color:var(--fg)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card p{margin:0;font-size:14px}
.meta{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 11px var(--mono);padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--fg)}
.chip.gold{background:var(--gold-soft);color:var(--fg)}
.chip.bad{color:var(--bad)} .chip.good{color:var(--good)} .chip.warn{color:var(--warn)}
.links{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.links a{overflow-wrap:anywhere}
.scorebar{display:flex;align-items:center;gap:8px;min-width:140px}
.scorebar .track{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.scorebar .fill{height:100%;background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.kpi{border-left:3px solid var(--gold);padding:4px 12px}
.kpi b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.list li{border-bottom:1px solid var(--line);padding-bottom:10px}
.prose{max-width:72ch} .prose p{margin:0 0 10px}
.back{font-size:14px;text-decoration:none;display:inline-block;margin-bottom:12px}
.notice{background:var(--gold-soft);border-radius:8px;padding:10px 14px;font-size:14px;margin:12px 0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.steps li::before{content:counter(s);font:700 26px/1 var(--display);color:var(--gold)}
.btn{font:600 14px var(--body);border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
form.add{display:grid;gap:10px;max-width:640px}
form.add label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.tiny{font-size:12px;color:var(--muted)}
nav a.navcj{background:var(--gold-soft);color:var(--fg);font-weight:600}
.cjband{background:var(--gold-soft);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.cjband h2{font-size:22px}
.cjcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:820px){.cjcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cjcard{background:var(--surface);border-radius:10px;padding:14px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:4px;border:1px solid transparent}
.cjcard:hover,.cjcard:focus-visible{border-color:var(--gold)}
.cjcard b{font:700 18px var(--display)}
.cjcard span{font-size:13px;color:var(--muted)}
.cjcard em{font-style:normal;font:600 12px var(--mono);color:var(--gold-ink,var(--fg));margin-top:4px}
.newsitem{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
@media(max-width:600px){.newsitem{grid-template-columns:minmax(0,1fr);gap:6px}}
.newsitem .d{font:500 12px var(--mono);color:var(--muted)}
.newsitem h3{font-size:16.5px;margin:0 0 4px}
.newsitem p{margin:0 0 6px;font-size:14.5px}
.newsitem .why{font-size:13.5px;color:var(--muted)}
.suggest{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-top:24px;font-size:14px}
:root{--t1:#e3ece1;--t2:#b7d4c1;--t3:#7fb598;--t4:#3f8a67;--t5:#1a5a42;--nodata:#e6e8e2;--r-North:#c9a227;--r-West:#c46b4a;--r-Central:#8a6fb0;--r-East:#3f8fb0;--r-Southern:#4f9a5a;--mapline:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t1:#2a3b31;--t2:#3d6150;--t3:#4f8a6c;--t4:#6cb592;--t5:#9fe0bd;--nodata:#2a312c;--r-North:#c9a84a;--r-West:#d0836a;--r-Central:#a28ccc;--r-East:#62acc9;--r-Southern:#6fb97a;--mapline:#111713}}
:root[data-theme="dark"]{--t1:#2a3b31;--t2:#3d6150;--t3:#4f8a6c;--t4:#6cb592;--t5:#9fe0bd;--nodata:#2a312c;--r-North:#c9a84a;--r-West:#d0836a;--r-Central:#a28ccc;--r-East:#62acc9;--r-Southern:#6fb97a;--mapline:#111713}
.tier{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap}
.tier i{width:14px;height:14px;border-radius:3px;display:inline-block;flex-shrink:0;border:1px solid var(--line)}
.cell{display:inline-block;width:28px;height:18px;border-radius:3px;border:1px solid var(--line);vertical-align:middle}
.scale{display:flex;gap:3px;align-items:stretch;max-width:420px}
.scale div{flex:1;height:12px;border-radius:2px;position:relative}
.scale div.on{outline:2px solid var(--fg);outline-offset:2px}
.scalelbl{display:flex;justify-content:space-between;max-width:420px;font-size:11.5px;color:var(--muted);margin-top:4px}
.crumbs{font-size:14px;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted)}
.crumbs a{text-decoration:none;padding:0;background:none;color:var(--accent);font-weight:500}
.homegrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:880px){.homegrid{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox path.c{cursor:pointer;stroke:var(--mapline);stroke-width:.6;transition:opacity .15s}
.mapbox path.c:hover,.mapbox path.c:focus{stroke:var(--fg);stroke-width:1.4;outline:none}
.mapbox path.na{fill:var(--nodata);stroke:var(--mapline);stroke-width:.6}
.mapbox circle.c{cursor:pointer;stroke:var(--mapline);stroke-width:1}
.mapbox .dim{opacity:.28}
.maptip{font-size:13.5px;min-height:20px;color:var(--muted)}
.legendrow{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legendrow span{display:inline-flex;align-items:center;gap:6px}
.legendrow i{width:12px;height:12px;border-radius:2px;display:inline-block}
.regioncards{display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.rcard:hover,.rcard:focus-visible{border-color:var(--accent)}
.rcard .sw{width:10px;height:100%;min-height:40px;border-radius:3px}
.rcard b{font:700 17px var(--display)}
.mix{display:flex;height:8px;border-radius:2px;overflow:hidden;width:110px}
.tilemap{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.tilemap button{aspect-ratio:1;border:0;border-radius:4px;font:500 10px var(--mono);cursor:pointer;color:var(--fg);padding:0}
.primer{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.ccard:hover{border-color:var(--accent)}
.profile{background:var(--fg);color:var(--bg)}
.profile .wrap{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding-block:10px}
.profile label{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--bg);opacity:.95}
.profile select{background:var(--bg);color:var(--fg);border:0;border-radius:6px;padding:7px 10px;font:500 14px var(--body);min-height:36px;max-width:220px}
.profile button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:6px;padding:6px 12px;font:600 13px var(--body);cursor:pointer;min-height:36px}
.profile .hint{font-size:13px;opacity:.8;margin-left:auto}
.foryou{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:18px}
.foryou .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.foryou h2{font-size:20px}
.mini{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.mini li{border-bottom:1px solid var(--line);padding-bottom:8px;font-size:14px}
.mini li b{display:block}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.match{font:600 11px var(--mono);background:var(--accent-soft);color:var(--fg);padding:2px 7px;border-radius:999px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
.btn-pill{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font:600 13px var(--body);cursor:pointer;min-height:36px}
.btn-pill.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn-pill.on .count{color:inherit;opacity:.85}
.drivers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.drivers .card h3{font-size:15px}
@media(max-width:640px){.profile .hint{margin-left:0}.profile select{max-width:100%}}
@media (prefers-reduced-motion:no-preference){.card,.steps li{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>

<header><div class="wrap bar">
  <a class="brand" href="#home">Africa AgriTech Atlas <small>54 countries</small></a>
  <nav id="nav" aria-label="Sections"></nav>
</div><div class="profile" id="profile"></div></header>
<main class="wrap" id="app"><div class="empty">Loading the Atlas…</div></main>

<script>
const VIEWS=[["home","Home"],["africa","Africa & regions"],["gaps","Gaps"],["startups","Startups"],["people","People"],["organizations","Organizations"],["policies","Regulation"],["benchmarks","Global"],["news","News"],["learn","Learn"]];
const SEGMENTS=["inputs & seeds","irrigation & water","mechanization","storage & cold chain","processing","logistics & market access","finance & insurance","data, climate & extension","climate & extension","data","energy","transport","digital connectivity","industrial zones"];
const S={seed:{},entries:[],news:[],loaded:false,stale:false,canWrite:null,f:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>{u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:""};
const splitUrls=s=>String(s||"").split(/\s*;\s*|\s+(?=https?:)/).map(safeUrl).filter(Boolean);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch{return "link"}};
const linkList=(arr)=>{const u=[...new Set((arr||[]).flatMap(splitUrls))];return u.length?`<div class="links">${u.map(x=>`<a href="${esc(x)}" target="_blank" rel="noopener">${esc(host(x))}</a>`).join("")}</div>`:""};
const items=k=>{const base=(S.seed[k]&&S.seed[k].items)||[];const add=S.entries.filter(e=>e.collection===k).map(e=>({...e.data,_added:true}));return base.concat(add)};
const countries=()=>items("countries");
const cName=iso=>{if(iso==="AU")return "Continental";const c=countries().find(c=>c.iso3===iso);return c?c.name:iso};
const fmt=(v,d=1)=>v==null||v===""?"–":Number(v).toFixed(d).replace(/\.0$/,"");
const PILLARS=[["productivity","Productivity"],["inputs_water","Inputs & water"],["policy","Policy"],["infrastructure","Infrastructure"],["finance","Finance access"]];
function score(c){const a=c.atlas;return a?{v:a.score,n:a.n_pillars,p:a.pillars||{}}:{v:null,n:0,p:{}}}
const bar=(v,n)=>v==null?"–":`<div class="scorebar"><div class="track"><div class="fill" style="width:${Math.max(2,Math.min(100,v))}%"></div></div><span class="count">${fmt(v,0)}${n<5?`<sup title="${n} of 5 pillars have data">*</sup>`:""}</span></div>`;
const opt=(vals,sel,all)=>`<option value="">${esc(all)}</option>`+vals.map(v=>`<option value="${esc(v[0])}" ${v[0]===sel?"selected":""}>${esc(v[1])}</option>`).join("");
const countryOpts=(sel)=>opt(countries().slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>[c.iso3,c.name]),sel,"All countries");
const regionOpts=sel=>opt(["North","West","Central","East","Southern"].map(r=>[r,r+" Africa"]),sel,"All regions");
const match=(o,q)=>!q||JSON.stringify(o).toLowerCase().includes(q.toLowerCase());
const statusChip=s=>{s=String(s||"");const cls=/shut|liquid|administration/i.test(s)?"bad":/pivot|restruct|unverified|down round/i.test(s)?"warn":/acquired/i.test(s)?"gold":"good";return `<span class="chip ${cls}">${esc(s.split(/[:(]/)[0].trim()||"unknown")}</span>`};
const addedChip=o=>o._added?`<span class="chip gold">added</span>`:"";

function nav(){let cur=(location.hash.slice(1)||"home").split("-")[0];if(["country","region","countries","overview"].includes(cur))cur="africa";const L=VIEWS.map(([k,l])=>`<a href="#${k}" ${k===cur?'aria-current="page"':""}>${l}</a>`);L.splice(1,0,`<a href="https://claude.ai/artifact/E4QTs1Hnomm9HAGnsm2AuJ" target="_blank" rel="noopener" class="navcj">Crop Journeys ↗</a>`);$("#nav").innerHTML=L.join("")}
function filters(key,html){return `<div class="filters" data-f="${key}">${html}</div>`}
function bindFilters(){document.querySelectorAll(".filters [name]").forEach(el=>{el.addEventListener(el.tagName==="INPUT"&&el.type==="search"?"input":"change",()=>{S.f[el.name]=el.type==="checkbox"?el.checked:el.value;render(true)})})}
const fv=k=>S.f[k]||"";
const ROLES=[["student","Student or newcomer"],["builder","Founder or builder"],["funder","Investor or funder"],["policy","Policy or development professional"],["research","Researcher or analyst"]];
const ls={get(k,d){try{const v=localStorage.getItem("atlas_"+k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem("atlas_"+k,JSON.stringify(v))}catch{}}};
S.p=Object.assign({role:"",region:"",country:"",segment:""},ls.get("profile",{}));
function allSegments(){return [...new Set(items("gaps").map(g=>g.segment).concat(items("startups").map(x=>x.segment)).filter(Boolean))].sort()}
function renderProfile(){
  const P=S.p;if(P.country&&!P.region)P.region=regionOf(P.country)||"";
  const cs=countries().filter(c=>c.region===P.region).sort((a,b)=>(b.deep-a.deep)||a.name.localeCompare(b.name));
  const deep=cs.filter(c=>c.deep),rest=cs.filter(c=>!c.deep);
  $("#profile").innerHTML=`<div class="wrap"><label for="p_role">I am a<select id="p_role"><option value="">Choose your role</option>${ROLES.map(([k,l])=>`<option value="${k}" ${P.role===k?"selected":""}>${l}</option>`).join("")}</select></label>
  <label for="p_region">Region<select id="p_region"><option value="">All of Africa</option>${AREGIONS.map(r=>`<option value="${r}" ${P.region===r?"selected":""}>${r} Africa</option>`).join("")}</select></label>

function vRegion(r){
  if(!AREGIONS.includes(r))return `${crumbs([["Africa","africa"],["Unknown region"]])}<div class="empty">Region not found.</div>`;
  const st=regionStats(r);const isos=new Set(st.cs.map(c=>c.iso3));
  const segCount={};items("gaps").filter(g=>isos.has(g.scope)).forEach(g=>segCount[g.segment]=(segCount[g.segment]||0)+1);
  const topSeg=Object.entries(segCount).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const starts=items("startups").filter(x=>isos.has(x.hq_iso3));const ppl=items("people").filter(p=>(p.countries||[]).some(i=>isos.has(i)));
  const blocs=[...new Set(st.cs.flatMap(c=>c.recs||[]))];
  const cards=st.cs.slice().sort((a,b)=>(tierOf(b.iso3)??-1)-(tierOf(a.iso3)??-1)||a.name.localeCompare(b.name));
  const firstSentence=t=>{t=String(t||"");const m=t.match(/^.*?[.!?](\s|$)/);return m?m[0]:t};
  const blurb=c=>{if(c.deep&&c.narrative)return firstSentence(c.narrative);const bits=[];if(c.ag_gdp_pct!=null)bits.push(`${fmt(c.ag_gdp_pct)}% of GDP`);if(c.ag_jobs_pct!=null)bits.push(`${fmt(c.ag_jobs_pct)}% of jobs`);return bits.length?`Agriculture is ${bits.join(" and ")}.${c.electricity_access_pct!=null?` ${fmt(c.electricity_access_pct)}% of people have electricity.`:""}`:"Baseline profile; deep dive not written yet."};
  return `${crumbs([["Africa","africa"],[r+" Africa"]])}
  <p class="eyebrow">Region</p><h1>${esc(r)} Africa</h1>
  <p class="lead">${st.cs.length} countries · ${st.deep} with deep dives · ${starts.length} startups and ${ppl.length} people in the Atlas${blocs.length?" · Trade blocs: "+esc(blocs.join(", ")):""}</p>
  <div class="homegrid section" style="margin-top:18px"><div>${mapPanel({mode:"tier",region:r})}</div>
   <div style="display:flex;flex-direction:column;gap:16px">
    <div><h2>How the region compares</h2><p class="sub" style="margin-top:4px">${st.leaders.length?`Leading: ${esc(st.leaders.join(", "))}. `:""}${st.adv.length?`Advancing: ${esc(st.adv.join(", "))}.`:""}${!st.leaders.length&&!st.adv.length?"No country in this region is in the top two groups yet.":""}</p><div style="margin-top:10px">${mixBar(st)}</div><div class="legendrow" style="margin-top:8px">${TIERS.map((t,i)=>st.mix[i]?`<span><i style="background:${t[1]}"></i>${t[0]}: ${st.mix[i]}</span>`:"").join("")}${st.nd?`<span><i style="background:var(--nodata)"></i>No data: ${st.nd}</span>`:""}</div></div>
    <div><h2>Most documented gaps here</h2>${topSeg.length?`<ul class="mini" style="margin-top:8px">${topSeg.map(([sg,n])=>`<li><b style="text-transform:capitalize">${esc(sg)}</b><span class="meta">${n} documented gap${n>1?"s":""} across this region's deep dives</span></li>`).join("")}</ul>`:`<p class="meta">No deep dives in this region yet, so gaps are not documented at country level. See the <a href="#gaps">continental gaps</a>.</p>`}</div>
    ${starts.length?`<div><h2>Startups based here</h2><p class="meta" style="margin-top:6px">${starts.slice(0,8).map(x=>esc(x.name)).join(" · ")}${starts.length>8?" and more":""}</p></div>`:""}
   </div></div>
  <div class="section"><h2>Countries in ${esc(r)} Africa</h2><p class="sub">Sorted from leading to early stage. Click one to open it.</p>
  <div class="ccards" style="margin-top:12px">${cards.map(c=>`<div class="ccard" data-go="country-${c.iso3}" tabindex="0" role="link"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(c.name)}</b>${c.deep?'<span class="chip acc">deep dive</span>':""}</div>${tierChip(tierOf(c.iso3))}<span class="meta">${esc(blurb(c))}</span></div>`).join("")}</div></div>`}

/* ---------- views ---------- */
function forYou(){
  const P=S.p;if(!P.role)return "";
  const iso=P.country,seg=P.segment;const C=iso?countries().find(c=>c.iso3===iso):null;const where=C?C.name:P.region?P.region+" Africa":"Africa";
  const segOk=x=>!seg||x===seg;
  const gaps=items("gaps").filter(g=>segOk(g.segment)&&(!iso||g.scope===iso||g.scope==="AU")&&regOK([g.scope],true)).sort((a,b)=>(b.scope===iso)-(a.scope===iso));
  const starts=items("startups").filter(x=>segOk(x.segment)&&(!iso||inC(x.countries,iso)||x.hq_iso3===iso)&&regOK((x.countries||[]).concat(x.hq_iso3)));
  const ppl=items("people").filter(x=>inC(x.countries,iso)&&regOK(x.countries));
  const orgs=items("organizations").filter(o=>inC(o.countries,iso)&&regOK(o.countries));
  const pols=items("policies").filter(x=>(!iso||x.scope===iso||x.scope==="AU")&&regOK([x.scope],true)).sort((a,b)=>(b.year||0)-(a.year||0));
  const bench=items("benchmarks");
  const meta=items("meta")[0]||{};
  const pillarLine=()=>{if(!C||!C.atlas||C.atlas.score==null)return "";const pr=Object.entries(C.atlas.pillars).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1]);const nm=k=>(PILLARS.find(p=>p[0]===k)||[])[1];return `${esc(C.name)} is in the <b>${esc(tierName(tierOf(C.iso3)))}</b> group. Strongest area: ${esc(nm(pr.at(-1)[0]))}; weakest: ${esc(nm(pr[0][0]))}.`};
  const li=(title,sub,go)=>`<li${go?` class="click" data-go="${go}" style="cursor:pointer"`:""}><b>${esc(title)}</b><span class="meta">${esc(sub)}</span></li>`;
  const list=(h,rows,more,empty)=>`<div><h2>${h}</h2><ul class="mini" style="margin-top:10px">${rows.length?rows.join(""):`<li class="meta">${empty||"Nothing matches yet. Try a wider focus."}</li>`}</ul>${more?`<p style="margin-top:8px"><a href="#${more[0]}">${more[1]} →</a></p>`:""}</div>`;
  const ofKind=k=>ppl.filter(x=>personKind(x)===k);
  const peopleList=(k,h)=>list(h,(ofKind(k).length?ofKind(k):ppl).slice(0,4).map(x=>li(x.name,`${x.role}${x.organization?", "+x.organization:""}${x.talk_to_about?" · Ask about: "+x.talk_to_about:""}`)),["people","All people"]);
  const gapList=(h,n,field)=>list(h,gaps.slice(0,n).map(g=>li(g.title,`${g.scope==="AU"?"Continental":cName(g.scope)} · ${g.segment} · ${String((field==="opp"?g.opportunity:g.root_causes)||g.evidence||"").slice(0,150)}`)),["gaps","Open the gap map"]);
  const R={
   builder:{h:`Problems worth building for in ${where}`,lead:`Start from a documented gap, check who already tried, then talk to operators.${seg?` Focused on ${esc(seg)}.`:""}`,
     cols:[gapList("Gaps to work on",4,"opp"),
       list("Who already tried",starts.slice().sort((a,b)=>(/shut|pivot|administration/i.test(b.status))-(/shut|pivot|administration/i.test(a.status))).slice(0,5).map(x=>li(x.name,`${x.segment} · ${String(x.status||"").split(/[:(]/)[0]} · ${x.model||""}`)),["startups","All startups"]),
       peopleList("builder","Operators to talk to")]},
   funder:{h:`Where capital is needed in ${where}`,lead:(meta.market_note?"Agtech funding fell about 20% in 2025 to just under US$170m, and debt and grants now outweigh equity. ":"")+(seg?`Focused on ${esc(seg)}.`:""),
     cols:[list("Active startups",starts.filter(x=>/^active/i.test(x.status||"")).slice(0,5).map(x=>li(x.name,`${x.segment} · ${x.notable_funding||"funding not recorded"}`)),["startups","All startups"]),
       list("Co-investors and DFIs",items("organizations").filter(o=>o.funder&&inC(o.countries,iso)).slice(0,5).map(o=>li(o.name,o.what||"")),["organizations","All organizations"]),
       gapList("Gaps with clear demand",3,"opp")]},
   policy:{h:`What works, and what can be copied, for ${where}`,lead:C?pillarLine():"No country met the Malabo benchmark. The leaders kept one funded plan for a decade or more.",
     cols:[list("Policies and frameworks",pols.slice(0,5).map(x=>li(x.title,`${x.scope==="AU"?"Continental":cName(x.scope)} · ${x.year||""} · ${x.status||""}`)),["policies","Regulation tracker"]),
       list("Benchmarks that transfer well",bench.filter(b=>/^high/i.test(b.transferability||"")).slice(0,4).map(b=>li(`${b.source_country}: ${b.theme}`,String(b.outcome||"").slice(0,140))),["benchmarks","All benchmarks"]),
       peopleList("policy","Officials and agencies")]},
   research:{h:`Open questions and data gaps for ${where}`,lead:C?`${pillarLine()} ${C.atlas&&C.atlas.n_pillars<5?"One pillar has no data.":""}`:"Irrigation data for most countries dates from around 2012, and 20 countries still lack a CAADP score in the Atlas.",
     cols:[gapList("Gaps, with root causes",4,"root"),
       list("Research organizations",orgs.filter(o=>o.type==="research").concat(items("organizations").filter(o=>o.type==="research"&&!inC(o.countries,iso))).slice(0,5).map(o=>li(o.name,o.what||"")),["organizations","All organizations"]),
       peopleList("research","Researchers to talk to")]},
   student:{h:`Your starting path${C?" into "+C.name:""}`,lead:"Learn the chain first, then one country, then the people. About three hours a week.",
     cols:[`<div><h2>Start here</h2><ul class="mini" style="margin-top:10px"><li><b><a href="https://claude.ai/artifact/E4QTs1Hnomm9HAGnsm2AuJ" target="_blank" rel="noopener">Crop Journeys</a></b><span class="meta">Follow cocoa, maize, coffee and tomatoes from seed to shelf</span></li>${li("The 12-week roadmap","From frameworks to your first contribution","learn")}${C?li(`${C.name} profile`,C.deep?"Deep dive with people, gaps and policies":"Baseline profile","country-"+C.iso3):li("Rwanda, Kenya and Morocco","Three different models of success","countries")}</ul></div>`,
       gapList("Problems to understand",3,"root"),
       peopleList("research","People to learn from")]}
  }[P.role];
  return `<section class="foryou" aria-label="Tailored for you"><div><span class="eyebrow">For you · ${esc((ROLES.find(r=>r[0]===P.role)||[])[1])}${iso?" · "+esc(where):""}${seg?" · "+esc(seg):""}</span><h1 style="font-size:clamp(24px,3vw,32px);margin-top:6px">${esc(R.h)}</h1>${R.lead?`<p class="lead" style="margin-top:6px">${R.lead}</p>`:""}</div>
  <div class="cols">${R.cols.join("")}</div>
  <p class="tiny">Other pages are pre-filtered to your focus. Change or clear it in the bar above.</p></section>`;
}

  const key={score:x=>-(x.s.v??-1),name:x=>x.c.name,br:x=>-(x.c.caadp_br4_score??-1),elec:x=>-(x.c.electricity_access_pct??-1),net:x=>-(x.c.internet_users_pct??-1),ag:x=>-(x.c.ag_gdp_pct??-1)}[sort]||(x=>-((x.s.p||{})[sort.slice(2)]??-1));

function vLearn(){
  return `<h1>Learning roadmap</h1><p class="lead">About 12 weeks from orientation to a first contribution. Each stage ends with something you make.</p>
  <p class="notice">New to value chains? Start with <a href="https://claude.ai/artifact/E4QTs1Hnomm9HAGnsm2AuJ" target="_blank" rel="noopener">Crop Journeys</a>: follow cocoa, maize, coffee and tomatoes from seed to shelf, with hands-on labs and a lingo notebook.</p>
  <ol class="steps section">
   <li><div><h3>Orient · weeks 1–2</h3><p>Learn the frameworks: Agenda 2063, CAADP (Malabo, then the Kampala Declaration 2026–2035), AfCFTA, PIDA, Mission 300. Start in the <a href="#policies">Regulation tracker</a> filtered to Continental.</p><p class="meta">Make: a one-page map of the institutions (AU, RECs, AfDB, CGIAR, AGRA, FAO).</p></div></li>
   <li><div><h3>Walk a value chain · weeks 3–4</h3><p>Follow one crop from seed to export: maize, cocoa or horticulture. Use the <a href="#gaps">Gap map</a> to see where value leaks.</p><p class="meta">Make: a value-chain sketch with each loss point tied to a documented gap.</p></div></li>
   <li><div><h3>Compare countries · weeks 5–6</h3><p>Read three deep dives with different models: <a href="#country-RWA">Rwanda</a> (state-led), <a href="#country-KEN">Kenya</a> (market-led, digital) and <a href="#country-MAR">Morocco</a> (export champion).</p><p class="meta">Make: a short memo on what explains the gap in outcomes.</p></div></li>
   <li><div><h3>Learn from abroad · week 7</h3><p>Study three <a href="#benchmarks">benchmarks</a> rated High transferability, such as Embrapa, Vietnam's land reform and India's digital public infrastructure.</p><p class="meta">Make: notes on what would and would not transfer, and why.</p></div></li>
   <li><div><h3>Talk to people · weeks 8–10</h3><p>Pick one country and one gap. Contact 5–8 people from the <a href="#people">People</a> directory with a specific question.</p><p class="meta">Make: interview notes logged against the gap.</p></div></li>
   <li><div><h3>Contribute · weeks 11–12</h3><p>Choose a path: build (startup or product), fund (investor thesis), shape (policy brief) or research (data project).</p><p class="meta">Make: a problem statement and a first small experiment.</p></div></li>
  </ol>
  <div class="section prose"><h2>How the Atlas score works</h2>
  <p>The score measures how strong a country's farm system and its foundations are, on five equal pillars: productivity (cereal yield, value added per farm worker), inputs and water (fertilizer per hectare, irrigated share of cropland), policy commitment (CAADP review score against the 9.29 benchmark, agriculture's share of public spending against the 10% target), infrastructure (electricity and internet access) and finance access (adults with a bank or mobile-money account).</p>
  <p>Each indicator is compared with the other African countries, so one outlier cannot swamp the rest. Countries are then placed into five color groups, from Early stage to Leading, each holding about a fifth of the 52 countries with enough data. A country needs data in 4 of 5 pillars to be placed. Read the pillars, not just the total: Rwanda leads on policy but trails on inputs and infrastructure, which is exactly where its gaps are.</p>
  <p class="tiny">Data: FAO and World Bank via Our World in Data (2023–2025), Global Findex 2024, UN SDG 2.a.1 (2023), AU 4th CAADP Biennial Review (2023), ITU. Irrigated share uses CIA irrigated-area estimates (2012–2020) over FAO cropland, so treat it as approximate.</p></div>
  <div class="section prose"><h2>How to be useful</h2>
  <p>Start from a documented gap rather than a technology. Talk to the people closest to the problem before proposing a fix. Check the <a href="#startups">Startups</a> list for who already tried; Gro Intelligence, Wefarm and Sendy all shut down, and their stories are free lessons.</p>
  <p>Glossary: <b>CAADP</b> Comprehensive Africa Agriculture Development Programme · <b>BR</b> Biennial Review · <b>REC</b> Regional Economic Community · <b>AfCFTA</b> African Continental Free Trade Area · <b>PIDA</b> Programme for Infrastructure Development in Africa · <b>AIDI</b> AfDB Africa Infrastructure Development Index · <b>DFI</b> development finance institution.</p></div>`;
}

const FORMS={
  people:[["name","Name"],["role","Role"],["organization","Organization"],["countries","Country codes (ISO-3, comma-separated)"],["focus","Focus"],["talk_to_about","Talk to them about"],["public_links","Public profile links (space-separated)"],["diaspora","Diaspora? (yes/no)"]],
  startups:[["name","Name"],["countries","Country codes (ISO-3, comma-separated)"],["segment","Segment"],["founded","Founded (year)"],["status","Status"],["model","Business model"],["notable_funding","Notable funding"],["website","Website"]],
  organizations:[["name","Name"],["type","Type (gov, regulator, research, DFI, investor, corporate, NGO)"],["countries","Country codes (ISO-3, comma-separated)"],["what","What they do"],["website","Website"]],
  policies:[["title","Title"],["scope","Scope (ISO-3 code, or AU)"],["type","Type (law, strategy, program, treaty)"],["year","Year"],["status","Status"],["summary","Summary"],["link","Link"]],
  gaps:[["title","Title"],["scope","Scope (ISO-3 code, or AU)"],["segment","Segment"],["root_causes","Root causes"],["evidence","Evidence"],["opportunity","Opportunity"],["evidence_source","Source link"]],
  benchmarks:[["source_country","Country"],["theme","Theme"],["what_happened","What happened"],["outcome","Outcome"],["transferability","Transferability (High/Medium/Low + why)"],["link","Link"]]
};
function vContribute(){
  const t=S.f.at||"people";
  const mine=S.entries.slice().sort((a,b)=>String(b.added_at).localeCompare(String(a.added_at))).slice(0,20);
  return `<h1>Suggest an addition or correction</h1>
  <p class="lead">The Atlas stays useful only if it stays current. If you know a startup, person, policy or gap that's missing, or something that has changed, tell us here.</p>
  <div class="kpis" style="margin-top:14px"><div class="kpi"><b style="font-size:18px">1. You suggest</b><span>Fill in what you know and a link that confirms it</span></div><div class="kpi"><b style="font-size:18px">2. It's reviewed</b><span>The Atlas owner checks the source</span></div><div class="kpi"><b style="font-size:18px">3. It appears</b><span>Marked "added" so readers know it's new</span></div></div>
  <p class="notice">In this prototype, suggestions appear straight away. In the finished site they will wait for review first. Public information only: no personal emails or phone numbers.</p>
  ${S.canWrite===false?`<p class="notice">You can browse the Atlas, but adding entries needs edit access from the owner.</p>`:S.db===null?`<p class="notice">Adding entries needs a signed-in view of the published Atlas.</p>`:""}
  <form class="add section" id="addform">
    <label>Record type<select id="at" name="at">${Object.keys(FORMS).map(k=>`<option value="${k}" ${k===t?"selected":""}>${k[0].toUpperCase()+k.slice(1)}</option>`).join("")}</select></label>
    ${FORMS[t].map(([k,l])=>`<label>${esc(l)}${/summary|focus|model|what|root|evidence$|opportunity|happened|outcome|transfer/.test(k)?`<textarea id="f_${k}" name="${k}" rows="2"></textarea>`:`<input type="text" id="f_${k}" name="${k}">`}</label>`).join("")}
    <label>Source link (where you verified this)<input type="url" id="f__source" name="_source" placeholder="https://"></label>
    <div><button class="btn" type="submit" ${S.canWrite===false||!S.db?"disabled":""}>Add to the Atlas</button> <span id="addmsg" class="meta" role="status"></span></div>
  </form>
  <div class="section"><h2>Recently added</h2>${mine.length?`<ul class="list">${mine.map(e=>`<li><span class="chip">${esc(e.collection)}</span> <b>${esc(e.data&&(e.data.name||e.data.title||e.data.theme))}</b> <span class="tiny">${esc(String(e.added_at||"").slice(0,10))}</span></li>`).join("")}</ul>`:`<p class="meta">Nothing added yet. The first entry you add appears here and in its section.</p>`}</div>`;
}
async function submitAdd(ev){
  ev.preventDefault(); const fd=new FormData(ev.target); const t=fd.get("at"); const msg=$("#addmsg");
  const d={}; for(const [k] of FORMS[t]){let v=String(fd.get(k)||"").trim(); if(!v) continue;
    if(k==="countries") v=v.split(/[,\s]+/).map(x=>x.toUpperCase()).filter(Boolean);
    else if(k==="public_links") v=v.split(/\s+/).map(safeUrl).filter(Boolean);
    else if(k==="diaspora") v=/^y/i.test(v);
    else if(k==="scope") v=v.toUpperCase();
    else if(k==="founded"||k==="year") v=Number(v)||v;
    d[k]=v}
  const src=safeUrl(fd.get("_source")); if(src){d.source=src; if(t!=="people") d.sources=[src]}
  if(!(d.name||d.title||d.theme)){msg.textContent="Add a name or title first.";return}
  msg.textContent="Saving…";
  try{const id=t+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await S.db.collection("entries").doc(id).set({collection:t,data:d,added_at:new Date().toISOString()});
    msg.textContent="Added. It now shows in "+t+"."; ev.target.reset(); $("#at").value=t;
  }catch(e){msg.textContent=e&&e.code==="quota_exceeded"?"The Atlas database is full. Ask the owner to clean up entries.":"Could not save: you may not have edit access."}
}

/* ---------- router ---------- */
function render(keepFocus){
  const active=keepFocus&&document.activeElement&&document.activeElement.name; const pos=active&&document.activeElement.selectionStart;
  nav(); let h=location.hash.slice(1)||"home"; if(h==="overview")h="home"; const app=$("#app"); computeTiers();
  if(!S.loaded){app.innerHTML=S.stale?`<div class="empty">The Atlas data can't be reached yet. Check your connection; the page keeps trying.</div>`:`<div class="empty">Loading the Atlas…</div>`;return}
  if(!S.seed.countries){app.innerHTML=`<div class="empty"><h2>The Atlas is empty</h2><p>Country, people and startup records appear here once the seed data is loaded.</p></div>`;return}
  const v=h.startsWith("country-")?vCountry(h.slice(8)):h.startsWith("region-")?vRegion(h.slice(7)):({home:vHome,africa:vOverview,countries:vCountries,gaps:vGaps,startups:vStartups,people:vPeople,organizations:vOrgs,policies:vPolicies,benchmarks:vBench,news:vNews,learn:vLearn,contribute:vContribute}[h]||vHome)();
  const SUG={startups:["startups","a startup"],people:["people","a person"],organizations:["organizations","an organization"],policies:["policies","a policy"],gaps:["gaps","a gap"],benchmarks:["benchmarks","a global example"]}[h];
  renderProfile();
  app.innerHTML=(S.stale?`<p class="notice">Showing saved data; it may be out of date.</p>`:"")+v+(SUG?suggestBox(SUG[0],SUG[1]):"");
  bindFilters();
  app.querySelectorAll("[data-go]").forEach(r=>{r.addEventListener("click",e=>{if(e.target.closest("a"))return;location.hash=r.dataset.go});r.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target===r)location.hash=r.dataset.go})});
  app.querySelectorAll("[data-region]").forEach(b=>b.addEventListener("click",()=>{S.f.gr=b.dataset.region;S.f.bq="";render()}));
  bindMap(app);
  app.querySelectorAll("[data-preset]").forEach(a=>a.addEventListener("click",()=>{S.f.at=a.dataset.preset}));
  app.querySelectorAll("[data-rgn]").forEach(b=>b.addEventListener("click",()=>{location.hash="region-"+b.dataset.rgn}));
  app.querySelectorAll("[data-mapmode]").forEach(b=>b.addEventListener("click",()=>{S.mapmode=b.dataset.mapmode;render()}));
  app.querySelectorAll("[data-scroll]").forEach(b=>b.addEventListener("click",()=>{const t=document.getElementById(b.dataset.scroll);if(t)t.scrollIntoView({behavior:"smooth"})}));
  app.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click",()=>{S.f.csort=b.dataset.sort;render()}));
  const f=$("#addform"); if(f){f.addEventListener("submit",submitAdd);$("#at").addEventListener("change",e=>{S.f.at=e.target.value;render()})}
  if(active){const el=app.querySelector(`[name="${active}"]`);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch{}}}
}
let lastView=null;
addEventListener("hashchange",()=>{render();const h=location.hash.slice(1);if(h!==lastView){scrollTo(0,0);lastView=h}});
render();

(async()=>{
  const db=window.claude?await window.claude.use("db"):null; S.db=db;
  if(!db){S.loaded=true;render();return}
  window.claude.use("user").then(u=>{if(u){const c=u.can("data.write");S.canWrite=c;render()}});
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  db.collection("seed").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});const first=!S.seed.countries;S.seed=o;if(first)applyProfileFilters();
    if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false} S.loaded=true;render(true)},
    ()=>{clearTimeout(timer);S.loaded=true;render()});
  db.collection("news").onSnapshot(snap=>{S.news=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(S.loaded)render(true)},()=>{});
  db.collection("entries").onSnapshot(snap=>{S.entries=snap.docs.map(d=>({id:d.id,...d.data()}));if(S.loaded)render(true)},()=>{});
})();
</script>
