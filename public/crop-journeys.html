:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}

/* chain */
.chainwrap{overflow-x:auto;padding-bottom:6px}
.chain{display:flex;gap:4px;min-width:720px;position:relative;padding-top:26px}
.chev{flex:1;position:relative;border:0;padding:12px 18px 12px 26px;min-height:78px;text-align:left;background:var(--sunk);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);display:flex;flex-direction:column;gap:2px;transition:background .15s}

.chev.seen .dot{background:var(--accent)}

.chev.up::after{background:var(--up)}.chev.farm::after{background:var(--farm)}.chev.mid::after{background:var(--mid)}.chev.down::after{background:var(--down)}
.chev[aria-current="step"]{background:var(--fg);color:var(--bg)}

.gate{position:absolute;top:0;bottom:0;border-left:2px dashed var(--gold);pointer-events:none}

/* stage */

.story{font-size:16.5px;line-height:1.6;margin:0;max-width:64ch}
.term{border:0;background:none;padding:0 1px;font:inherit;color:inherit;text-decoration:underline dotted var(--gold);text-decoration-thickness:2px;text-underline-offset:3px;min-height:auto}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fact{background:var(--sunk);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fact .k{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:560px){.vl{grid-template-columns:minmax(0,1fr)}}
.vl div{border-radius:8px;padding:12px 14px;font-size:14px}
.vl .v{background:var(--good-soft)} .vl .l{background:var(--bad-soft)}
.vl b{display:block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.vl .v b{color:var(--good)} .vl .l b{color:var(--bad)}
.country{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-size:14.5px}
.country b{font-size:12px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.versus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:560px){.versus{grid-template-columns:minmax(0,1fr)}}
.versus div{border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px}
.versus b{display:block;font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.expert{border-top:1px dashed var(--line);padding-top:12px;font-size:14px;color:var(--muted)}
.expert b{color:var(--fg)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
/* notebook */
.notebook{position:sticky;top:12px;background:var(--gold-soft);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.notebook h3{font:700 17px var(--display)}
.def{background:var(--surface);border-radius:8px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.def b{font-size:15px}
.wordlist{display:flex;flex-wrap:wrap;gap:6px}
.wordlist button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;min-height:30px}
.meter{height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.small{font-size:12.5px;color:var(--muted)}
/* lab */
.lab{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.lab .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.stack{display:flex;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.stack div{display:flex;align-items:center;justify-content:center;font:600 12px var(--mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap;transition:flex-basis .4s}
.keyrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:13.5px}
.keyrow div{display:flex;gap:8px;align-items:baseline}
.keyrow i{width:10px;height:10px;border-radius:2px;flex-shrink:0;display:inline-block}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.big{font:700 30px var(--display);font-variant-numeric:tabular-nums}
.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.controls label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:220px;flex:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.out{border-radius:10px;padding:14px;background:var(--sunk);display:flex;flex-direction:column;gap:4px}
.out.win{background:var(--good-soft)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:170px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:14px}
@media(max-width:560px){.bar{grid-template-columns:110px minmax(0,1fr) 84px;font-size:13px}}
.bar .track{height:16px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar .fill{height:100%;transition:width .5s}
.crates{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;max-width:520px}
.crates i{aspect-ratio:1;border-radius:2px;background:var(--farm);transition:background .3s}
.crates i.hit{background:var(--bad)}
.road{position:relative;height:40px;border-bottom:2px dashed var(--line);margin:4px 0 6px}
.truck{position:absolute;bottom:4px;left:0;font:600 12px var(--mono);background:var(--fg);color:var(--bg);padding:3px 8px;border-radius:4px;transition:left 1.6s ease-in-out}
@media (prefers-reduced-motion:reduce){.truck,.stack div,.bar .fill,.crates i{transition:none}}
/* quiz */
.quiz{background:var(--fg);color:var(--bg);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px}
.quiz h2{color:var(--bg)}
.quiz .opts{display:grid;gap:8px}
.quiz .opts button{text-align:left;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);border-radius:8px;padding:12px 14px;min-height:44px}
.quiz .opts button.right{background:var(--good);border-color:var(--good);color:#fff}
.quiz .opts button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.quiz .why{font-size:14.5px;opacity:.9}
.done{display:inline-flex;gap:8px;align-items:center;font:600 12px var(--mono);background:var(--gold);color:var(--fg);padding:4px 10px;border-radius:999px;letter-spacing:.04em}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
footer a{overflow-wrap:anywhere}
</style>

const GLOSS={
 "value chain":"Every step from inputs to the consumer, and the value added (and money earned) at each one.",
 "upstream":"The steps before the farm: seed, fertilizer, tools, advice.",
 "downstream":"The steps after the crop leaves the farm: processing, branding, selling.",
 "midstream":"The middle: collecting, storing, moving and first processing.",
 "farm gate":"The point where the crop leaves the farmer's hands. The price paid here is the farmgate price.",
 "farmgate price":"What the farmer is paid at the farm, before transport, processing or retail margins.",
 "smallholder":"A farmer on a small plot, usually under 2 hectares, using mostly family labor.",
 "yield":"Output per area, usually tonnes per hectare (t/ha). One hectare is about two and a half acres.",
 "inputs":"What a farmer buys to grow a crop: seed, fertilizer, pesticide, tools.",
 "extension":"Advice to farmers on better practices, from government officers, companies, hotlines or apps.",
 "hybrid seed":"Seed bred by crossing two parent lines for higher yield. It has to be bought again each season.",
 "e-voucher":"A digital coupon, often sent by text message, that lets a registered farmer buy subsidized inputs.",
 "post-harvest loss":"Crop lost after harvest to rot, pests, bruising, spillage or poor storage.",
 "aflatoxin":"A poison made by mould on badly dried or stored grain. It causes liver cancer and can kill at high doses.",
 "hermetic bag":"An airtight storage bag. Insects inside run out of oxygen and die, with no chemicals.",
 "aggregator":"A trader or co-op that buys small amounts from many farmers and bulks them into truckloads.",
 "strategic reserve":"Grain a government stores to release during shortages or price spikes.",
 "warehouse receipt":"A certificate for stored grain that can be sold or borrowed against without moving the grain.",
 "fermentation":"For cocoa, heaping wet beans for 5–7 days so microbes develop the chocolate flavor.",
 "forward sales":"Selling a crop months before harvest at a price agreed today.",
 "grinding":"Roasting and crushing cocoa beans into liquor, then pressing it into cocoa butter and powder.",
 "traceability":"Being able to track a bag back to the farm or plot it came from.",
 "cherry":"The red fruit of the coffee tree. The coffee bean is the seed inside.",
 "washing station":"A shared facility that pulps, ferments, washes and dries coffee cherries into higher-value washed coffee.",
 "green coffee":"Hulled, sorted, unroasted coffee beans. This is what gets exported.",
 "specialty coffee":"Coffee scoring 80+ out of 100 in professional tasting (cupping). It earns premium prices.",
 "commodity exchange":"A market where graded produce is traded on standard terms, like the Ethiopia Commodity Exchange.",
 "cold chain":"Unbroken refrigeration from farm to shop: cold rooms, refrigerated trucks, chilled shelves.",
 "packhouse":"A facility where fresh produce is washed, sorted, graded, packed and cooled.",
 "reefer":"A refrigerated truck or shipping container.",
 "tariff-rate quota":"A set volume a country can export at low or zero import duty; above it, higher duty applies.",
 "drip irrigation":"Watering each plant through small tubes, drop by drop, using far less water than flooding fields."
};
const SEGS={up:"Upstream",farm:"On the farm",mid:"Midstream",down:"Downstream"};
const T=s=>s; // marker helper for readability

{id:"cocoa",name:"Cocoa",sub:"Export cash crop",countries:[["CIV","Côte d'Ivoire"],["GHA","Ghana"]],

/* ---------- state ---------- */
const store={get(k,d){try{const v=localStorage.getItem("cj_"+k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem("cj_"+k,JSON.stringify(v))}catch{}}};
const S={crop:"cocoa",i:0,country:{},expert:store.get("expert",false),seen:store.get("seen",{}),words:store.get("words",[]),quiz:store.get("quiz",{}),term:null,lab:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const crop=()=>CROPS.find(c=>c.id===S.crop);

const seenSet=id=>new Set(S.seen[id]||[]);
function markSeen(){const c=crop();const s=seenSet(c.id);s.add(S.i);S.seen[c.id]=[...s];store.set("seen",S.seen)}
function addWord(t){if(!GLOSS[t])return;S.term=t;if(!S.words.includes(t)){S.words.push(t);store.set("words",S.words)}}

/* ---------- render ---------- */
function renderCrops(){
  $("#crops").innerHTML=CROPS.map(c=>{const n=seenSet(c.id).size;const q=S.quiz[c.id]!=null;return `<button class="crop" aria-pressed="${c.id===S.crop}" data-crop="${c.id}"><b>${c.name}</b><span>${c.sub} · ${c.countries.map(x=>x[1]).join(", ")}</span><span class="prog">${n}/${c.stages.length} stages${q?" · quiz done":""}</span></button>`}).join("");

}
function chain(c){
  const gateIdx=c.stages.findIndex(s=>s.seg==="mid");
  const seen=seenSet(c.id);
  return `<div class="chainwrap"><div class="chain" id="chain">${c.stages.map((s,i)=>`<button class="chev ${s.seg}${seen.has(i)?" seen":""}" data-step="${i}" ${i===S.i?'aria-current="step"':""} aria-label="Stage ${i+1}: ${esc(s.t)}"><span class="dot" aria-hidden="true"></span><span class="n">${i+1} · ${SEGS[s.seg]}</span><span class="t">${esc(s.t)}</span></button>`).join("")}<div class="gate" id="gate" data-gate="${gateIdx}"><span>Farm gate</span></div></div></div>
  <div class="legend">${Object.entries(SEGS).map(([k,v])=>`<span><i style="background:var(--${k})"></i>${v}</span>`).join("")}<span>· a green dot means you've visited</span></div>`;
}
function stagePanel(c){
  const s=c.stages[S.i];const cc=S.country[c.id]||c.countries[0][0];
  const segColor=`var(--${s.seg})`;
  let countryBlock="";
  if(c.compare&&s.vs){countryBlock=`<div class="versus">${c.countries.map(([k,n])=>`<div><b style="color:${k==="MAR"?"var(--accent)":"var(--bad)"}">${n}</b>${linkTerms(s.vs[k])}</div>`).join("")}</div>`}
  else if(s.c&&s.c[cc]){const nm=c.countries.find(x=>x[0]===cc)[1];countryBlock=`<div class="country"><b>In ${esc(nm)}</b><br>${linkTerms(s.c[cc])}</div>`}
  return `<article class="panel" aria-live="polite">
    <span class="segname" style="color:${segColor}">Stage ${S.i+1} of ${c.stages.length} · ${SEGS[s.seg]}</span>

    <p class="story">${linkTerms(s.story)}</p>
    <div class="facts">${s.who?`<div class="fact"><span class="k">Who does it</span>${esc(s.who)}</div>`:""}<div class="fact"><span class="k">The number to know</span>${esc(s.num)}</div></div>
    ${s.v||s.l?`<div class="vl">${s.v?`<div class="v"><b>Where value is added</b>${esc(s.v)}</div>`:""}${s.l?`<div class="l"><b>Where it leaks</b>${esc(s.l)}</div>`:""}</div>`:""}
    ${countryBlock}
    ${S.expert&&s.x?`<div class="expert"><b>Expert note.</b> ${linkTerms(s.x)}</div>`:""}
    ${!S.expert&&s.x?`<p class="small">Switch to Expert for a deeper note on this stage.</p>`:""}
    <div class="nav"><button class="btn ghost" id="prev" ${S.i===0?"disabled":""}>← Previous stage</button><button class="btn" id="next">${S.i===c.stages.length-1?"Try the lab ↓":"Next stage →"}</button></div>
  </article>`;
}
function notebook(){
  const t=S.term;const total=Object.keys(GLOSS).length;
  return `<aside class="notebook" aria-label="Your lingo notebook"><h3>Your lingo notebook</h3>
    ${t?`<div class="def"><b>${esc(t)}</b>${esc(GLOSS[t])}</div>`:`<div class="def">Tap any word with a dotted underline to see what it means. It is saved here as you go.</div>`}
    <div class="meter" aria-hidden="true"><i style="width:${S.words.length/total*100}%"></i></div>

    <div class="wordlist">${S.words.map(w=>`<button data-term="${esc(w)}">${esc(w)}</button>`).join("")}</div>
  </aside>`;
}

  <div class="stack" data-dyn="cps" role="img" aria-label="Price split of a dark chocolate bar">${parts.map(p=>`<div style="flex-basis:${p[1]/sum*100}%;background:${p[2]}" title="${p[0]}">${p[1]>9?Math.round(p[1])+"%":""}</div>`).join("")}</div>
  <div class="keyrow" data-dyn="cpk">${parts.map(p=>`<div><i style="background:${p[2]}"></i><span>${p[0]}: <b class="num">€${(price*p[1]/100).toFixed(2)}</b> (${p[1]}%)</span></div>`).join("")}</div>
  <div style="border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px">
   <div class="head"><h3>The 2024 price spike: world price vs what an Ivorian farmer was paid</h3><div class="seg" role="group" aria-label="Pick a moment">${["Dec 2024","Early 2026"].map((l,i)=>`<button data-era="${i}" aria-pressed="${era===i}">${l}</button>`).join("")}</div></div>
   <div class="bars">
    <div class="bar"><span>World price</span><div class="track"><div class="fill" style="width:${E.world/12931*100}%;background:var(--down)"></div></div><span class="num">US$${E.world.toLocaleString()}/t</span></div>
    <div class="bar"><span>Farmer's price</span><div class="track"><div class="fill" style="width:${E.farm/12931*100}%;background:var(--farm)"></div></div><span class="num">~US$${E.farm.toLocaleString()}/t</span></div>
   </div>
   <p class="small">${E.note} Farmer got about <b>${Math.round(E.farm/E.world*100)}%</b> of the world price. Dollar values are approximate conversions.</p>
  </div></section>`;
}
function labMaize(){
  const bags=S.lab.bags??40,st=S.lab.store??"sack";
  const loss=st==="sack"?0.275:0.02;const lossRange=st==="sack"?"15–40%":"1–3%";
  const now=bags*3200,keep=Math.round(bags*(1-loss)),later=keep*4000;
  const better=later>now;
  return `<section class="lab"><div class="head"><div><span class="eyebrow">Lab · the storage decision</span><h2>Sell at harvest, or store and wait?</h2></div><span class="small">Kenya, 90-kg bags · illustrative</span></div>
  <div class="controls"><label for="bags">Harvest: <b class="num" data-dyn="bv" style="color:var(--fg)">${bags} bags</b><input type="range" id="bags" min="5" max="100" step="5" value="${bags}"></label>
   <div class="seg" role="group" aria-label="Storage">${[["sack","Ordinary sacks"],["hermetic","Hermetic bags"]].map(([k,l])=>`<button data-store="${k}" aria-pressed="${st===k}">${l}</button>`).join("")}</div></div>
  <div class="outcomes" data-dyn="mo">
   <div class="out ${!better?"win":""}"><span class="small">Sell at harvest (~KSh 3,200/bag, a typical distress price)</span><span class="big">KSh ${now.toLocaleString()}</span><span class="small">${bags} bags sold</span></div>
   <div class="out ${better?"win":""}"><span class="small">Store ~8 months, sell at KSh 4,000/bag (board price, Jan 2026)</span><span class="big">KSh ${later.toLocaleString()}</span><span class="small">${keep} bags survive · ${lossRange} lost in ${st==="sack"?"ordinary sacks":"hermetic bags"} (midpoint used)</span></div>
  </div>
  <p class="small" data-dyn="mp">${better?`Waiting pays here: <b>KSh ${(later-now).toLocaleString()}</b> more.`:`Waiting loses money here: storage losses eat the higher price.`} Switch the storage type to see the difference. Bag costs, credit and price risk are left out; loss ranges come from on-farm trials (Stathers et al., 2017).</p></section>`;
}
function labCoffee(){
  const mode=S.lab.coffee??"ladder";
  const L=[["Rwanda, average export (2025)",6.2],["Best of Rwanda top lot (2025)",88],["Best of Rwanda record (Oct 2026)",452],["Ethiopia Cup of Excellence record (2024)",981]];
  const max=Math.log10(1000);
  const exp=S.lab.exp??6;
  return `<section class="lab"><div class="head"><div><span class="eyebrow">Lab · the value ladder</span><h2>What quality does to a kilo of green coffee</h2></div><div class="seg" role="group" aria-label="View">${[["ladder","Price ladder"],["share","Farmer share"]].map(([k,l])=>`<button data-coffee="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div></div>
  ${mode==="ladder"?`<div class="bars">${L.map(([n,v])=>`<div class="bar"><span>${n}</span><div class="track"><div class="fill" style="width:${Math.max(4,Math.log10(v)/max*100)}%;background:var(--mid)"></div></div><span class="num">US$${v.toLocaleString()}/kg</span></div>`).join("")}</div>
  <p class="small">Bars use a log scale, so each step to the right is ten times more. The top lot sold for about 70× Rwanda's average export price. Ethiopia's record (US$445/lb) is converted to kilos. Only tiny volumes sell at these prices.</p>`:
  `<div class="controls"><label for="exp">Export price of green coffee: <b class="num" data-dyn="ev" style="color:var(--fg)">US$${exp.toFixed(1)}/kg</b><input type="range" id="exp" min="2" max="12" step="0.5" value="${exp}"></label></div>
  <div class="outcomes" data-dyn="eo"><div class="out"><span class="small">Ethiopian farmer gets ~60%</span><span class="big">US$${(exp*0.6).toFixed(2)}</span></div><div class="out win"><span class="small">Brazilian or Colombian farmer gets ~87%</span><span class="big">US$${(exp*0.87).toFixed(2)}</span></div></div>
  <p class="small">Same export price, different chains. More layers of middlemen in Ethiopia mean less reaches the farm (FOLU, 2025).</p>`}</section>`;
}
function labTomatoes(){
  const pack=S.lab.pack??"raffia",ran=S.lab.ran??false;const rate=pack==="raffia"?0.41:0.05;
  const n=100,hit=Math.round(n*rate);
  return `<section class="lab"><div class="head"><div><span class="eyebrow">Lab · ride the truck</span><h2>Send 100 crates of tomatoes from Kano to Lagos</h2></div><div class="seg" role="group" aria-label="Packaging">${[["raffia","Raffia baskets"],["crates","Plastic crates"]].map(([k,l])=>`<button data-pack="${k}" aria-pressed="${pack===k}">${l}</button>`).join("")}</div></div>
  <div class="road" aria-hidden="true"><span class="truck" id="truck" style="left:${ran?"calc(100% - 90px)":"0"}">Kano → Lagos</span></div>
  <div class="crates" role="img" aria-label="${ran?hit+" of 100 loads damaged":"100 loads ready to leave"}">${Array.from({length:n},(_,i)=>`<i class="${ran&&i<hit?"hit":""}"></i>`).join("")}</div>
  <div class="controls"><button class="btn" id="drive">${ran?"Drive again":"Start the 998 km drive"}</button><span>${ran?`<b class="big" style="color:var(--bad)">${hit}%</b> of fruit arrives damaged in ${pack==="raffia"?"raffia baskets":"plastic crates"}.`:"Pick packaging, then drive."}</span></div>
  <p class="small">Damage rates from a study of the Kano–Lagos route (Babarinsa et al., 2018, cited by IFDC): ~41% in raffia baskets, ~5% in plastic crates. In Morocco, fruit is packed and cooled in packhouses and travels in refrigerated trucks.</p></section>`;
}
function quiz(c){
  const ans=S.quiz[c.id];
  return `<section class="quiz"><span class="eyebrow" style="color:var(--bg);opacity:.75">Check yourself</span><h2>${esc(c.quiz.q)}</h2><div class="opts">${c.quiz.o.map((o,i)=>`<button data-ans="${i}" class="${ans!=null?(i===c.quiz.a?"right":(i===ans?"wrong":"")):""}" ${ans!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>${ans!=null?`<p class="why">${ans===c.quiz.a?"Right. ":"Not quite. "}${esc(c.quiz.why)}</p>${seenSet(c.id).size===c.stages.length?`<span class="done">Journey complete</span>`:`<span class="small" style="color:var(--bg)">Visit every stage to complete this journey.</span>`}`:""}</section>`;
}
function labHTML(){return {cocoa:labCocoa,maize:labMaize,coffee:labCoffee,tomatoes:labTomatoes}[crop().lab]()}
function patchLab(){const tmp=document.createElement("div");tmp.innerHTML=labHTML();tmp.querySelectorAll("[data-dyn]").forEach(n=>{const live=document.querySelector(`[data-dyn="${n.dataset.dyn}"]`);if(live)live.outerHTML=n.outerHTML})}
function render(){
  const c=crop();
  if(S.i>=c.stages.length)S.i=0;
  markSeen();renderCrops();
  $("#lvl-begin").setAttribute("aria-pressed",String(!S.expert));$("#lvl-expert").setAttribute("aria-pressed",String(S.expert));
  const cc=S.country[c.id]||c.countries[0][0];
  const lab=labHTML();
  $("#main").innerHTML=`
   <div class="intro"><div><span class="eyebrow">${esc(c.sub)}</span><h2 style="font-size:30px">${esc(c.name)}</h2><p>${linkTerms(c.intro)}</p></div>
   ${c.compare?`<span class="small">Side-by-side: ${c.countries.map(x=>x[1]).join(" vs ")}</span>`:`<div class="countries" role="group" aria-label="Country">${c.countries.map(([k,n])=>`<button data-country="${k}" aria-pressed="${cc===k}">${n}</button>`).join("")}</div>`}</div>
   ${chain(c)}
   <div class="stagegrid">${stagePanel(c)}${notebook()}</div>
   <div id="labanchor">${lab}</div>
   ${quiz(c)}`;
  $("#foot").innerHTML=`Sources for ${esc(c.name)}: ${c.src.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(" · ")}. Part of the Africa AgriTech Atlas. Figures as of November 2026.`;
  placeGate();
}
function placeGate(){const g=$("#gate");if(!g)return;const i=+g.dataset.gate;const b=document.querySelector(`.chev[data-step="${i}"]`);if(!b){g.hidden=true;return}g.style.left=(b.offsetLeft-2)+"px"}
addEventListener("resize",placeGate);

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const c=crop();
  if(t.dataset.crop){S.crop=t.dataset.crop;S.i=0;S.term=null;history.replaceState(null,"","#"+S.crop);render();return}
  if(t.dataset.step){S.i=+t.dataset.step;render();return}
  if(t.dataset.term){addWord(t.dataset.term);render();return}
  if(t.dataset.country){S.country[c.id]=t.dataset.country;render();return}
  if(t.id==="prev"){S.i=Math.max(0,S.i-1);render();return}
  if(t.id==="next"){if(S.i<c.stages.length-1){S.i++;render()}else{$("#labanchor").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}return}
  if(t.id==="lvl-begin"||t.id==="lvl-expert"){S.expert=t.id==="lvl-expert";store.set("expert",S.expert);render();return}
  if(t.dataset.era){S.lab.cocoaEra=+t.dataset.era;render();return}
  if(t.dataset.store){S.lab.store=t.dataset.store;render();return}
  if(t.dataset.coffee){S.lab.coffee=t.dataset.coffee;render();return}
  if(t.dataset.pack){S.lab.pack=t.dataset.pack;S.lab.ran=false;render();return}
  if(t.id==="drive"){if(S.lab.ran){S.lab.ran=false;render();requestAnimationFrame(()=>requestAnimationFrame(()=>{S.lab.ran=true;render()}))}else{S.lab.ran=true;render()}return}
  if(t.dataset.ans){S.quiz[c.id]=+t.dataset.ans;store.set("quiz",S.quiz);render();return}
});
document.addEventListener("input",e=>{
  const id=e.target.id;const v=+e.target.value;
  const key={cp:"cocoaPrice",bags:"bags",exp:"exp"}[id];if(!key)return;
  S.lab[key]=v;patchLab();
});
function fromHash(){const h=location.hash.slice(1);if(CROPS.some(c=>c.id===h)){S.crop=h;S.i=0}}
addEventListener("hashchange",()=>{fromHash();render()});
fromHash();render();
</script>
